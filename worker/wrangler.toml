name = "cosmic-protocol-worker"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# ============================================================================
# DURABLE OBJECTS
# ============================================================================

[[durable_objects.bindings]]
name = "PLANET_DO"
class_name = "PlanetDO"
script_name = "cosmic-protocol-worker"

# ============================================================================
# DATABASE (D1)
# ============================================================================

[[d1_databases]]
binding = "DB"
database_name = "og-game"

# ============================================================================
# KEY-VALUE STORE (KV)
# ============================================================================

[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_ID"
preview_id = "YOUR_KV_PREVIEW_ID"

# ============================================================================
# OBJECT STORAGE (R2)
# ============================================================================

[[r2_buckets]]
binding = "R2"
bucket_name = "og-game"
preview_bucket_name = "og-game-preview"

# ============================================================================
# AI (WORKERS AI)
# ============================================================================

[ai]
binding = "AI"

# ============================================================================
# SCHEDULED EVENTS (CRON)
# ============================================================================

[[triggers.crons]]
cron = "*/1 * * * *"

# ============================================================================
# BUILD CONFIGURATION
# ============================================================================

[build]
command = "npm run build"

[build.upload]
format = "modules"
